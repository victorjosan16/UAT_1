<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Dulap PAL 800x1800x400mm - Vizualizare 3D</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#1e2126; height:100%; font-family: Arial, sans-serif; }
  #info {
    position:absolute; top:12px; left:12px; color:#eee; background:rgba(20,20,25,0.65);
    padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.5; pointer-events:none;
  }
  #info b { color:#f0c674; }
  canvas { display:block; }
  .sheet-frame { position:absolute; inset:18px; border:1px solid rgba(255,255,255,0.18); pointer-events:none; }
  .dim { position:absolute; color:#f2f2f0; font-size:13px; letter-spacing:0.3px;
    background:rgba(15,16,19,0.55); padding:4px 10px; border-radius:6px; pointer-events:none; white-space:nowrap; }
  #dim-top { top:24px; left:50%; transform:translateX(-50%); }
  #dim-left { left:24px; top:50%; transform:translateY(-50%) rotate(-90deg); transform-origin:center; }
  #dim-right { right:24px; top:50%; transform:translateY(-50%) rotate(90deg); transform-origin:center; }
  #dim-bottom { bottom:24px; right:24px; }
</style>
</head>
<body>
<div class="sheet-frame"></div>
<div class="dim" id="dim-top">800 mm &nbsp;·&nbsp; lățime</div>
<div class="dim" id="dim-left">1800 mm &nbsp;·&nbsp; înălțime</div>
<div class="dim" id="dim-right">400 mm &nbsp;·&nbsp; adâncime</div>
<div class="dim" id="dim-bottom">picior 100 mm</div>
<div id="info">
  <b>Dulap PAL — 800 x 1800 x 400 mm</b><br>
  Picioare: 100 mm | 4 rafturi + 1 bară agățat<br>
</div>
</body>
</html>
